<div id="obef-mini-map" class="w-full text-base" style="color:var(--viz-text)">
<style>
#obef-mini-map .bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end;margin-bottom:.9rem}
#obef-mini-map .ctl{display:flex;flex-direction:column;gap:.25rem;min-width:150px;flex:1}
#obef-mini-map label{font-size:.75rem;color:var(--viz-muted);font-weight:700}
#obef-mini-map select,#obef-mini-map input{width:100%;border:1px solid var(--viz-border);border-radius:.65rem;padding:.65rem .72rem;background:var(--viz-card);color:var(--viz-text);font-size:1rem}
#obef-mini-map button{min-height:44px}
#obef-mini-map .overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:.75rem}
#obef-mini-map .pillar{border:1px solid var(--viz-border);border-top:4px solid var(--pc);border-radius:.75rem;padding:.75rem;background:var(--viz-card)}
#obef-mini-map .phead{font-weight:800;font-size:.9rem;margin-bottom:.55rem}
#obef-mini-map .kpi{width:100%;text-align:left;border:1px solid var(--viz-border);border-radius:.55rem;background:transparent;color:var(--viz-text);padding:.5rem .55rem;margin:.22rem 0}
#obef-mini-map .kpi:hover{background:var(--viz-panel)}
#obef-mini-map .muted{font-size:.75rem;color:var(--viz-muted)}
#obef-mini-map .flow{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(190px,1fr) minmax(270px,2fr);gap:.75rem;align-items:start}
#obef-mini-map .panel{border:1px solid var(--viz-border);border-radius:.75rem;padding:.8rem;background:var(--viz-card);min-width:0}
#obef-mini-map .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--viz-muted);margin-bottom:.55rem}
#obef-mini-map .kpi-title{font-weight:850;font-size:1.02rem}
#obef-mini-map .dsbtn{width:100%;display:flex;justify-content:space-between;gap:.45rem;align-items:center;text-align:left;border:1px solid var(--viz-border);border-radius:.55rem;padding:.52rem .58rem;background:transparent;color:var(--viz-text);margin:.3rem 0}
#obef-mini-map .dsbtn.active{border-color:var(--viz-accent);background:var(--viz-accent-bg)}
#obef-mini-map .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:.42rem}
#obef-mini-map code{display:block;border:1px solid var(--viz-border);border-radius:.5rem;padding:.48rem .52rem;background:var(--viz-panel);overflow-wrap:anywhere;font-size:.75rem;color:var(--viz-text)}
#obef-mini-map .group{margin-bottom:.75rem}
#obef-mini-map .group:last-child{margin-bottom:0}
#obef-mini-map .ghead{display:flex;justify-content:space-between;gap:.5rem;font-weight:800;font-size:.82rem;margin-bottom:.4rem}
#obef-mini-map .back{border:1px solid var(--viz-border);border-radius:.6rem;background:var(--viz-card);color:var(--viz-text);padding:.55rem .7rem;font-weight:700}
#obef-mini-map .empty{border:1px dashed var(--viz-border);border-radius:.6rem;padding:.9rem;text-align:center;color:var(--viz-muted)}
#obef-mini-map .note{font-size:.72rem;color:var(--viz-muted);margin-top:.7rem}
@media(max-width:700px){#obef-mini-map .flow{grid-template-columns:1fr}#obef-mini-map .ctl{min-width:100%}}
</style>
<div class="bar">
<div class="ctl"><label for="pFilter">Pillar</label><select id="pFilter"></select></div>
<div class="ctl" style="flex:2"><label for="kFilter">KPI</label><select id="kFilter"></select></div>
<div class="ctl" style="flex:1.4"><label for="qField">Search HEDB field</label><input id="qField" type="search" placeholder="e.g. Grad_Program_Code"></div>
<button id="backBtn" type="button" class="back">All KPIs</button>
</div>
<div id="mapView" aria-live="polite"></div>
<div class="note">Click any KPI to see the visual path <strong>KPI → HEDB dataset → exact HEDB database attributes</strong>. Mapping is based on OBEF v11.5 and the uploaded HEDB Data Dictionary 2026.</div>
<script>
(()=>{
const root=document.querySelector('#obef-mini-map');if(root.dataset.ready)return;root.dataset.ready='1';
const raw=[["1.1","Employment Rate","1. Employment Outcomes",{"Graduates":["Grad_Student_ID","Grad_Academic_Period","Grad_Student_Email_Address","Grad_Student_Mobile_Number","Grad_Program_Code","Grad_Area_of_Specialization","Grad_Major_CIP"]}],["1.2","Employment Rate in Relevant Jobs","1. Employment Outcomes",{"Graduates":["Grad_Student_ID","Grad_Academic_Period","Grad_Program_Code","Grad_Area_of_Specialization","Grad_Major_CIP","Grad_Student_Email_Address","Grad_Student_Mobile_Number"]}],["2.1","Assessment Quality Review","2. Learning Outcomes",{"CLOs":["CLO_Program_Code","Crse_code","CLO_code","CLO_desc"],"PLO":["PLO_Program_code","PLO_code","PLO_description"],"Courses":["Course_code","Course_desc","Course_Grade"]}],["2.2","Retention Rate (FYR)","2. Learning Outcomes",{"Students - Enrollments":["Enroll_Student_ID","Enroll_Academic_Period","Enroll_1st_Academic_Period","Enroll_Student_Level","Enroll_Program_Code","Enroll_Student_Degree","Enroll_Transfer_Institution"],"Student- Attrition":["Attrition_Student_ID","Attrition_Academic_Period","Attrition_Program_Code","Attrition_Category","Attrition_Reason"],"Institute - Academic Programs":["Prog_one_year_program"]}],["2.3","Employer Feedback in Work Placements","2. Learning Outcomes",{"Students - Internship":["Internship_Student_ID","Internship_Program_Code","Internship_satisfaction","Internship_Status","Internship_Organization","Internship_type","Internship_Start_Date","Internship_End_Date","Internship_Training_Entity_Supervisor_Name","Internship_Training_Entity_Email"]}],["2.4","Employer Feedback in Employment","2. Learning Outcomes",{"Institute - Employers":["EC_Academic_Year","EC_Name_Employer","EC_Company_Name","EC_Sector","EC_Industry","EC_Email","EC_Phone"]}],["2.5","Rate of Graduates Obtaining Microcredentials & Licenses","2. Learning Outcomes",{"Graduates - Licensures":["GLC_Student_ID","GLC_Academic_Period","GLC_Program_Code","GLC_LC_Name","GLC_Org_name","GLC_status","GLC_date","GLC_LC_number"],"Students - Licensures":["SLC_Student_ID","SLC_Program_Code","SLC_LC_Name","SLC_status","SLC_date"],"Graduates":["Grad_Student_ID","Grad_Academic_Period","Grad_Program_Code"]}],["2.6","Student Satisfaction with Learning Experience","2. Learning Outcomes",{"Courses":["Course_Program_Name","Course_Academic_Period","Course_code","Course_CRN","Course_eval_score","Student_Numbers"]}],["3.1","Job Offer Post Work Placement","3. Industry Collaboration",{"Students - Internship":["Internship_Student_ID","Internship_Program_Code","Internship_Organization","Internship_Status","Internship_Start_Date","Internship_End_Date","Internship_type"],"Graduates":["Grad_Student_ID","Grad_Academic_Period","Grad_Program_Code","Grad_Workplacement"]}],["3.2","Student Participation Rate in Work Placements","3. Industry Collaboration",{"Students - Internship":["Internship_Student_ID","Internship_Program_Code","Internship_Status","Internship_type","Internship_credits","Internship_Start_Date","Internship_End_Date"],"Graduates":["Grad_Student_ID","Grad_Academic_Period","Grad_Program_Code"],"Institute - Academic Programs":["Prog_Internship"]}],["3.3","Joint Industry Courses","3. Industry Collaboration",{"Courses":["Course_Program_Name","Course_Academic_Period","Course_code","Course_CRN","Course_credit","Course_credit_hours","Course_contact_hours","Course_CoDev","Course_CoDev_Percent","Course_CoDeliver","Course_CoDeliver_percent","Course_CoSessions"],"Course Faculty":["Course_faculty_type","Course_IndustryName","Course_IndustryEmail","Course_teaching_percent","Course_design_percent"],"Institute - Partnerships":["Partner_Type","Partnership_Agreement"]}],["3.4","Industry Contributions","3. Industry Collaboration",{"Institute - Financials":["Finance_Year","Finance_Type_Code","Finance_Revenue_External_Research_Grants_Industry","Finance_Revenue_Private_Donation","Finance_Revenue_Endowments","Finance_Revenue_Patents","Finance_Revenue_joint_ventures","Finance_Revenue_Inkind","Finance_Revenue_Consult_Service","Finance_Revenue_External_Other"],"Institute - Partnerships":["Partner_Type","Partner_contribution","Partnership_value","Partnership_Agreement"],"Students - Scholarship":["Sch_Scholarship_Provider_Type","Sch_Scholarship_Provider_Name","Sch_Scholarship_Amount"],"Institute - Academic Programs":["Prog_Revenue_External_Research_Grants_Industry","Prog_Revenue_Private_Donation","Prog_Revenue_Endowments","Prog_Revenue_Patents","Prog_Revenue_joint_ventures","Prog_Revenue_Inkind","Prog_Revenue_Consult_Service"]}],["4.1","Publication Ratio","4. Research Outcomes",{"Institute - Publications":["Pub_Year","Pub_Faculty_Id","Pub_Published_Work","Pub_Year_Publication","Pub_Publication_Type","Pub_Referee_Indicator","Pub_scopus_Indicator"],"Employee Workload":["Load_Employee_ID","Load_Full_Part_Time","Load_Employee_Category","Load_Position_Title","Load_Program_codes"],"Employee - Basic Details":["Emp_Employee_ID","Emp_Qualification","Emp_Position_Title","Emp_Employment_Status"]}],["4.2","Field-Weighted Citation Impact (FWCI)","4. Research Outcomes",{"Employee Workload":["Load_Employee_ID","Load_FWCI","Load_Program_codes"],"Institute - Publications":["Pub_Faculty_Id","Pub_Year_Publication","Pub_Published_Work"]}],["4.3","Joint Industry Research","4. Research Outcomes",{"Institute - Research Projects":["Project_ID","Research_Year","Funding_Amount","Joint_Industry_Indicator","Joint_Industry_partner","Joint_Partner_type","Joint_contribution_type","Joint_Partner_funds","Joint_Intellectual","Intellectual Contribution_other","Program_codes","MOU_Number"],"Institute - Partnerships":["Partner_Type","Partnership_ID","Partnership_Agreement"]}],["4.4","Student Participation Rate in Research","4. Research Outcomes",{"Students - Research":["SR_Student_ID","SR_Academic_Period","SR_Program_Code","SR_Type_of_Research","SR_scholarly","SR_Research_Topic","SR_Research_Area","Impact_ indexed publication","Impact_Registered_IP","Impact_Competitions","Impact_scholarship","Impact_policy","Impact_revenue","Impact_Spinoff","Impact_public","Impact_education","Impact_media"],"Students - Enrollments":["Enroll_Student_ID","Enroll_Academic_Period","Enroll_Program_Code"]}],["4.5","Impact of Research","4. Research Outcomes",{"Research IMPACT":["Project_ID","Year","Project_Title","Research_Type","Impact_funding","Impact_Comm","Impact_policy","Impact_outreach"],"Institute - Research Projects":["Impact_indicator","Impact_Assessment"]}],["4.6","Awarded Intellectual Property","4. Research Outcomes",{"Institute - Intellectual Property":["IP_Year","IP_Status","IP_Title","IP_type","IP_Application_Number","IP_Date_Issued","IP_Number","IP_Office","IP_Application_Designation_Country","IP_Applicants_Owners","Percentage share of the HEI in the IP"]}],["5.1","Global University and Subject Rankings","5. Reputation",{"Students - Scholarship":["Sch_Student_ID","Sch_Scholarship_Provider_Type","Sch_Scholarship_Provider_Name"],"Students - Enrollments":["Enroll_Student_ID"],"Institute - Academic Programs":["Prog_Alumni"],"Institute - Employers":["EC_Company_Name","EC_Academic_Year"]}],["5.2","International Accreditation Status","5. Reputation",{"Institute - Academic Programs":["Prog_Program_Code","Prog_International_Accreditation_Eligibility","Prog_International_Accreditation_Received","Prog_International_Accreditation_Date","Prog_International_Accreditation_Name","Prog_International_Accreditation_Valid_Date","Prog_Branch_campus"],"Institute - Overview":["Overview_Accreditation_Body","Date_international_accreditation","International_accreditation_expiration","Overview_Branch_campus"]}],["5.3","Student Participation in International Dual/Joint Degrees & Mobility","5. Reputation",{"Students - Enrollments":["Enroll_Student_ID","Enroll_Academic_Period","Enroll_Program_Code","Enroll_Outgoing_Exchange_Indicator","Enroll_Exchange_University_Code","Enroll_dual"],"Institute - Academic Programs":["Prog_Joint_Dual_Program","Prog_Name_Of_Partner_University","Prog_Country_Of_Partner_University","Prog_Code_Of_Partner_University","Prog_Branch_campus"]}],["5.4","International Research Collaboration","5. Reputation",{"Institute - Research Projects":["Project_ID","Research_Year","Funding_Amount","International_Collabo_Indicator","Joint_INTL_partner","Joint_INTLPartner_type","Joint_INTLcontribution_type","Joint_INTLPartner_funds","Joint_INTLIntellectual","Joint_INTLIntellectual_other","Program_codes","MOU_Number"],"Students - Research":["SR_Student_Degree","SR_Type_of_Research","SR_Intl_partner","SR_Intl_Super_Name"]}],["6.1","Academic Events with Student Participation","6. Community Engagement",{"Institute - Events":["Event_ID","Event_Year","Event_main_category","Event_Category","Event_Type","HEI_role","Event_specialization","Event_hours","Event_Attendees","Event_student_ind","Event_Start_Date","Event_End_Date","Event_Website"]}],["6.2","Events & Initiatives for the Community","6. Community Engagement",{"Institute - Events":["Event_ID","Event_Year","Event_main_category","Event_Category","Event_Type","HEI_role","Event_specialization","Event_Audience","Audience_Type","Event_Attendees","Event_hours","Event_Ticket_Price","Event_Website"]}]];
const data=raw.map(x=>({id:x[0],name:x[1],pillar:x[2],datasets:x[3]}));
const colors={1:'var(--viz-series-2)',2:'var(--viz-series-3)',3:'var(--viz-series-4)',4:'var(--viz-series-5)',5:'var(--viz-series-6)',6:'var(--viz-muted)'};
const v=root.querySelector('#mapView'),ps=root.querySelector('#pFilter'),ks=root.querySelector('#kFilter'),q=root.querySelector('#qField'),back=root.querySelector('#backBtn');let activeDs='ALL';
const pn=k=>k.id.split('.')[0], esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pillars=[...new Map(data.map(k=>[pn(k),k.pillar])).entries()];
ps.innerHTML='<option value="ALL">All pillars</option>'+pillars.map(([n,t])=>`<option value="${n}">${esc(t)}</option>`).join('');
function fillKpis(){const p=ps.value;const list=data.filter(k=>p==='ALL'||pn(k)===p);ks.innerHTML='<option value="">Select KPI…</option>'+list.map(k=>`<option value="${k.id}">${k.id} — ${esc(k.name)}</option>`).join('')}
function overview(){activeDs='ALL';ks.value='';q.value='';v.innerHTML=`<div class="overview">${pillars.map(([n,t])=>{const list=data.filter(k=>pn(k)===n);return `<section class="pillar" style="--pc:${colors[n]}"><div class="phead">${esc(t)}</div>${list.map(k=>{const dc=Object.keys(k.datasets).length;const fc=Object.values(k.datasets).reduce((a,b)=>a+b.length,0);return `<button type="button" class="kpi" data-kpi="${k.id}"><strong>${k.id}</strong> · ${esc(k.name)}<div class="muted">${dc} dataset${dc!==1?'s':''} · ${fc} mapped fields</div></button>`}).join('')}</section>`}).join('')}</div>`;v.querySelectorAll('[data-kpi]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.kpi)))}
function show(id){const k=data.find(x=>x.id===id);if(!k)return;ks.value=id;activeDs='ALL';q.value='';render(k)}
function render(k){const names=Object.keys(k.datasets),query=q.value.trim().toLowerCase();const allCount=Object.values(k.datasets).reduce((a,b)=>a+b.length,0);const buttons=['ALL',...names].map(ds=>{const c=ds==='ALL'?allCount:k.datasets[ds].length;return `<button type="button" class="dsbtn ${activeDs===ds?'active':''}" data-ds="${esc(ds)}"><span>${esc(ds==='ALL'?'All datasets':ds)}</span><span class="muted">${c}</span></button>`}).join('');const groups=names.filter(ds=>activeDs==='ALL'||ds===activeDs).map(ds=>{const fields=k.datasets[ds].filter(f=>!query||(ds+' '+f).toLowerCase().includes(query));if(!fields.length)return'';return `<div class="group"><div class="ghead"><span>${esc(ds)}</span><span class="muted">${fields.length} fields</span></div><div class="fields">${fields.map(f=>`<code>${esc(f)}</code>`).join('')}</div></div>`}).join('');v.innerHTML=`<div class="flow"><section class="panel" style="border-top:4px solid ${colors[pn(k)]}"><div class="label">1 · KPI</div><div class="kpi-title">${k.id} · ${esc(k.name)}</div><div class="muted" style="margin-top:.35rem">${esc(k.pillar)}</div></section><section class="panel"><div class="label">2 · HEDB datasets</div>${buttons}</section><section class="panel"><div class="label">3 · Dataset attributes</div>${groups||'<div class="empty">No field matches the current search.</div>'}</section></div>`;v.querySelectorAll('[data-ds]').forEach(b=>b.addEventListener('click',()=>{activeDs=b.dataset.ds;render(k)}))}
ps.addEventListener('change',()=>{fillKpis();overview()});ks.addEventListener('change',()=>ks.value?show(ks.value):overview());q.addEventListener('input',()=>{if(ks.value)render(data.find(k=>k.id===ks.value))});back.addEventListener('click',overview);fillKpis();overview();
})();
</script>
</div>
